[build-system]
requires = ["setuptools==75.8.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "nl2sql-semantic-robustness"
version = "0.1.0"
description = "Offline controlled experiments for semantic robustness in Text-to-SQL"
requires-python = ">=3.10,<3.13"
dependencies = [
  "torch==2.5.1", "transformers==4.48.3", "datasets==3.2.0",
  "accelerate==1.3.0", "sentencepiece==0.2.0", "protobuf==5.29.3",
  "sqlglot==26.3.9", "PyYAML==6.0.2", "numpy==1.26.4",
  "safetensors==0.5.2"
]

[project.optional-dependencies]
test = ["pytest==8.3.4"]

[project.scripts]
nl2sql = "nl2sql.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
